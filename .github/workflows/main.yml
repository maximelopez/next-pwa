name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/mds/pwa-maxime
            rm -rf .next                    # supprime les anciens builds
            git fetch origin main
            git reset --hard origin/main    # écrase tous les fichiers avec GitHub
            npm ci                          # installation propre et complète
            npm run build                   # génère le dossier .next/
            pm2 delete next-pwa || true     # supprime l’ancien process
            pm2 start npm --name next-pwa -- start -- -p 40110
            pm2 save                        # sauvegarde PM2 pour redémarrage automatique
